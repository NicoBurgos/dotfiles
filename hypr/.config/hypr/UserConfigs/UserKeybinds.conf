# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# User keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf
# for any system bindings that might conflict with the ones defined here.

# See https://wiki.hyprland.org/Configuring/Keywords/ for full reference.

# /* ---- ✳️ Variables ✳️ ---- */
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# User defaults (editor, terminal, browser, etc.)
source = $UserConfigs/01-UserDefaults.conf

# /* ---- 🚀 APP LAUNCHERS ---- */
bind = $mainMod, SPACE, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window  # Main Menu
bind = $mainMod, Return, exec, $term   # Terminal
bind = $mainMod, E, exec, $files       # File manager
bind = $mainMod, K, exec, kitty        # Kitty
bind = $mainMod, B, exec, $browser     # Browser
bind = $mainMod, V, exec, $scriptsDir/ClipManager.sh   # Clipboard manager
bind = $mainMod, C, exec, code --ozone-platform=x11    # VS Code
bind = $mainMod, P, exec, bitwarden-desktop            # Bitwarden
bind = $mainMod, O, exec, obsidian --enable-features=UseOzonePlatform --ozone-platform=wayland  # Obsidian
bind = $mainMod, M, exec, pear-desktop                 # Pear Desktop (YT Music)
bind = $mainMod, W, exec, wasistlos                    # wasistlos (WhatsApp)
bind = $mainMod, Y, exec, xdg-open "https://youtube.com"  # YouTube web
bind = $mainMod, I, exec, $term -e /home/linuxbrew/.linuxbrew/bin/opencode  # OpenCode (linuxbrew)
bind = $mainMod, D, exec, kitty -e lazydocker          # Lazydocker
bind = $mainMod, T, exec, kitty -e btop                # btop
bind = $mainMod, S, exec, $scriptsDir/RofiSearch.sh    # Google search

# /* ---- 🎵 APP-LEVEL FEATURES ---- */
bind = ALT, N, exec, nmgui                             # nmgui (WhatsApp alt)
bind = $mainMod SHIFT, M, exec, $UserScripts/RofiBeats.sh  # RofiBeats (online music)

# /* ---- 🪟 MASTER LAYOUT (focused window = biggest) ---- */
bind = $mainMod CTRL, I, layoutmsg, swapwithmaster     # Focused ↔ master (predictable)
bind = $mainMod CTRL, period, layoutmsg, mfact +0.05   # Master más grande
bind = $mainMod CTRL, comma, layoutmsg, mfact -0.05    # Master más chica
bind = $mainMod CTRL, 0, layoutmsg, mfact 0.5          # Reset 50/50
bind = $mainMod ALT, F, exec, $scriptsDir/ToggleMaximize.sh   # Maximizar sin fullscreen

# /* ---- 🖼️ WINDOW / FLOAT ---- */
bind = $mainMod SHIFT, F, fullscreen                   # Fullscreen
bind = $mainMod CTRL, F, fullscreen, 1                 # Fake fullscreen
bind = $mainMod, F, togglefloating,                    # Toggle float
bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat  # All float

# /* ---- ⚙️ SYSTEM ---- */
bind = , PRINT, exec, ~/.config/hypr/UserScripts/lightshot.sh
bind = $mainMod_SHIFT, PRINT, exec, bash -c 'hyprshot -m region --clipboard-only'
bind = $mainMod SHIFT, H, exec, $scriptsDir/KeyHints.sh            # Cheat sheet
bind = $mainMod SHIFT, R, exec, $scriptsDir/Refresh.sh             # Refresh waybar/swaync/rofi
bind = $mainMod SHIFT, O, exec, $scriptsDir/ChangeBlur.sh          # Toggle blur
bind = $mainMod SHIFT, T, exec, $UserScripts/Toggle-tuned.sh       # Toggle tuned (no-op en Arch)
bind = $mainMod SHIFT, D, exec, $UserScripts/SyncDotfiles.sh      # Sync dotfiles
bind = $mainMod SHIFT, B, exec, $UserScripts/SyncBlog.sh           # Sync blog
bind = $mainMod SHIFT, C, exec, $UserScripts/RcloneSync.sh        # Rclone sync
bind = $mainMod SHIFT, A, exec, $scriptsDir/Animations.sh          # Animations menu
bind = $mainMod SHIFT, G, exec, $UserScripts/MountGdrive.sh        # Mount Gdrive

# /* ---- 📊 WAYBAR ---- */
bind = $mainMod CTRL ALT, B, exec, pkill -SIGUSR1 waybar            # Toggle waybar
bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh         # Waybar styles
bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh          # Waybar layout

# /* ---- 🎨 WALLPAPER ---- */
bind = $mainMod SHIFT, W, exec, $UserScripts/WallpaperSelect.sh    # Select wallpaper
bind = $mainMod SHIFT ALT, W, exec, $UserScripts/WallpaperEffects.sh  # Wallpaper effects
bind = CTRL ALT, W, exec, $UserScripts/WallpaperRandom.sh          # Random wallpaper

# /* ---- 🧰 WORKSPACE TOOLS ---- */
bind = $mainMod SHIFT, L, exec, $scriptsDir/ChangeLayout.sh        # Layout toggle (dwindle↔master)
bind = $mainMod SHIFT, P, exec, hyprpicker -a / –autocopy          # Color picker
bind = $mainMod SHIFT, K, exec, $scriptsDir/KeyBinds.sh            # Search keybinds
bind = $mainMod SHIFT, Z, exec, $UserScripts/ZshChangeTheme.sh    # Change zsh theme
bind = $mainMod SHIFT, Return, exec, $scriptsDir/Dropterminal.sh $term  # Drop terminal
bind = $mainMod CTRL, O, exec, hyprctl setprop active opaque toggle # Toggle opacity
bind = $mainMod CTRL, C, exec, $UserScripts/RofiCalc.sh            # Rofi calculator
bind = $mainMod SHIFT, V, exec, systemd-run --user --scope $scriptsDir/parrotOS-KVM.sh  # KVM

# /* ---- 🔍 ZOOM ---- */
bind = $mainMod ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bind = $mainMod ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"

# /* ---- 😀 EMOJI ---- */
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh             # Emoji picker
