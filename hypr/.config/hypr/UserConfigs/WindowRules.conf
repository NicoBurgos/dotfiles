# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# NOTES: This is only for Hyprland > 0.48

# note for ja: This should NOT be implemented on Debian and Ubuntu

# windowrulev2 - tags - add apps under appropriate tag to use the same settings
# browser tags
windowrulev2 {
  name = windowrulev2-1
  tag = +browser
  match:class = ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
}

windowrulev2 {
  name = windowrulev2-2
  tag = +browser
  match:class = ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
}

windowrulev2 {
  name = windowrulev2-3
  tag = +browser
  match:class = ^(chrome-.+-Default)$ # Chrome PWAs
}

# windowrulev2 = tag +browser, class:^([Cc]hromium)$
windowrulev2 {
  name = windowrulev2-4
  tag = +browser
  match:class = ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
}

windowrulev2 {
  name = windowrulev2-5
  tag = +browser
  match:class = ^(Brave-browser(-beta|-dev|-unstable)?)$
}

windowrulev2 {
  name = windowrulev2-6
  tag = +browser
  match:class = ^([Tt]horium-browser|[Cc]achy-browser)$
}

windowrulev2 {
  name = windowrulev2-7
  tag = +browser
  match:class = ^(zen-alpha|zen)$
}


# notif tags
windowrulev2 {
  name = windowrulev2-8
  tag = +notif
  match:class = ^(swaync-control-center|swaync-notification-window|swaync-client|class)$
}


# KooL settings tag
windowrulev2 {
  name = windowrulev2-9
  tag = +KooL_Cheat
  match:title = ^(KooL Quick Cheat Sheet)$
}

windowrulev2 {
  name = windowrulev2-10
  tag = +KooL_Settings
  match:title = ^(KooL Hyprland Settings)$
}

windowrulev2 {
  name = windowrulev2-11
  tag = +KooL-Settings
  match:class = ^(nwg-displays|nwg-look)$
}


# terminal tags
windowrulev2 {
  name = windowrulev2-12
  tag = +terminal
  match:class = ^(Alacritty|kitty|kitty-dropterm)$
}


# email tags
windowrulev2 {
  name = windowrulev2-13
  tag = +email
  match:class = ^([Tt]hunderbird|org.gnome.Evolution)$
}

windowrulev2 {
  name = windowrulev2-14
  tag = +email
  match:class = ^(eu.betterbird.Betterbird)$
}


# project tags
windowrulev2 {
  name = windowrulev2-15
  tag = +projects
  match:class = ^(codium|codium-url-handler|VSCodium)$
}

windowrulev2 {
  name = windowrulev2-16
  tag = +projects
  match:class = ^(VSCode|code-url-handler)$
}

windowrulev2 {
  name = windowrulev2-17
  tag = +projects
  match:class = ^(jetbrains-.+)$ # JetBrains IDEs
}


# screenshare tags
windowrulev2 {
  name = windowrulev2-18
  tag = +screenshare
  match:class = ^(com.obsproject.Studio)$
}


# IM tags
# windowrulev2 = tag +im, class:^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$
windowrulev2 {
  name = windowrulev2-19
  tag = +im
  center = on
  float = on
  size = (monitor_w*0.6) (monitor_h*0.7)
  match:class = ^([Ff]erdium)$
}

windowrulev2 {
  name = windowrulev2-20
  tag = +im
  match:class = ^([Ww]hatsapp-for-linux)$
}

windowrulev2 {
  name = windowrulev2-21
  tag = +im
  match:class = ^(ZapZap|com.rtosta.zapzap)$
}

windowrulev2 {
  name = windowrulev2-22
  tag = +im
  match:class = ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$
}

windowrulev2 {
  name = windowrulev2-23
  tag = +im
  match:class = ^(teams-for-linux)$
}

windowrulev2 {
  name = windowrulev2-24
  tag = +im
  match:class = ^(im.riot.Riot|Element)$ # Element Matrix client
}


# game tags
windowrulev2 {
  name = windowrulev2-25
  tag = +games
  match:class = ^(gamescope)$
}

windowrulev2 {
  name = windowrulev2-26
  tag = +games
  match:class = ^(steam_app_\d+)$
}


# gamestore tags
windowrulev2 {
  name = windowrulev2-27
  tag = +gamestore
  match:class = ^([Ss]team)$
}

windowrulev2 {
  name = windowrulev2-28
  tag = +gamestore
  match:title = ^([Ll]utris)$
}

windowrulev2 {
  name = windowrulev2-29
  tag = +gamestore
  match:class = ^(com.heroicgameslauncher.hgl)$
}


# file-manager tags
windowrulev2 {
  name = windowrulev2-30
  tag = +file-manager
  match:class = ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
}

windowrulev2 {
  name = windowrulev2-31
  tag = +file-manager
  match:class = ^(app.drey.Warp)$
}


# wallpaper tags
windowrulev2 {
  name = windowrulev2-32
  tag = +wallpaper
  match:class = ^([Ww]aytrogen)$
}


# multimedia tags
windowrulev2 {
  name = windowrulev2-33
  tag = +multimedia
  match:class = ^([Aa]udacious)$
}


# multimedia-video tags
windowrulev2 {
  name = windowrulev2-34
  tag = +multimedia_video
  match:class = ^([Mm]pv|vlc)$
}


# settings tags
windowrulev2 {
  name = windowrulev2-35
  tag = +settings
  center = on
  match:title = ^(ROG Control)$
}

windowrulev2 {
  name = windowrulev2-36
  tag = +settings
  match:class = ^(wihotspot(-gui)?)$ # wifi hotspot
}

windowrulev2 {
  name = windowrulev2-37
  tag = +settings
  match:class = ^([Bb]aobab|org.gnome.[Bb]aobab)$ # Disk usage analyzer
}

windowrulev2 {
  name = windowrulev2-38
  tag = +settings
  match:class = ^(gnome-disks|wihotspot(-gui)?)$
}

windowrulev2 {
  name = windowrulev2-39
  tag = +settings
  match:title = (Kvantum Manager)
}

windowrulev2 {
  name = windowrulev2-40
  tag = +settings
  match:class = ^(file-roller|org.gnome.FileRoller)$ # archive manager
}

windowrulev2 {
  name = windowrulev2-41
  tag = +settings
  match:class = ^(nm-applet|nm-connection-editor|blueman-manager)$
}

windowrulev2 {
  name = windowrulev2-42
  tag = +settings
  center = on
  match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
}

windowrulev2 {
  name = windowrulev2-43
  tag = +settings
  match:class = ^(qt5ct|qt6ct|[Yy]ad)$
}

windowrulev2 {
  name = windowrulev2-44
  tag = +settings
  match:class = (xdg-desktop-portal-gtk)
}

windowrulev2 {
  name = windowrulev2-45
  tag = +settings
  match:class = ^(org.kde.polkit-kde-authentication-agent-1)$
}

windowrulev2 {
  name = windowrulev2-46
  tag = +settings
  match:class = ^([Rr]ofi)$
}



# Custom rule
windowrulev2 {
  name = windowrulev2-47
  tile = on
  match:class = ^([Cc]hromium)$
}

windowrulev2 {
  name = windowrulev2-48
  size = (monitor_w*0.25) (monitor_h*0.55)
  float = on
  match:class = ^(com.network.manager)$
}

windowrulev2 {
  name = windowrulev2-49
  workspace = special:nyx
  match:class = ^([Vv]esktop|[Dd]iscord|[Ss]potify)$
}


# viewer tags
windowrulev2 {
  name = windowrulev2-50
  tag = +viewer
  match:class = ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$ # system monitor
}

windowrulev2 {
  name = windowrulev2-51
  tag = +viewer
  match:class = ^(evince)$ # document viewer
}

windowrulev2 {
  name = windowrulev2-52
  tag = +viewer
  match:class = ^(eog|org.gnome.Loupe)$ # image viewer
}


# Some special override rules
windowrulev2 {
  name = windowrulev2-53
  no_blur = on
  opacity = 1.0
  match:tag = multimedia_video*
}

 


# POSITION
# windowrulev2 = center,floating:1 # warning, it cause even the menu to float and center.
windowrulev2 {
  name = windowrulev2-54
  center = on
  float = on
  size = (monitor_w*0.65) (monitor_h*0.9)
  match:tag = KooL_Cheat*
}

windowrulev2 {
  name = windowrulev2-55
  center = on
  float = on
  match:class = ([Tt]hunar)
  match:title = negative:(.*[Tt]hunar.*)
}

windowrulev2 {
  name = windowrulev2-56
  center = on
  float = on
  match:tag = KooL-Settings*
}

windowrulev2 {
  name = windowrulev2-57
  center = on
  match:title = ^(Keybindings)$
}

windowrulev2 {
  name = windowrulev2-58
  center = on
  size = (monitor_w*0.6) (monitor_h*0.7)
  match:class = ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
}

windowrulev2 {
  name = windowrulev2-59
  move = ((monitor_w*0.61)) ((monitor_h*0.07))
  float = on
  size = (monitor_w*0.38) (monitor_h*0.38)
  pin = on
  keep_aspect_ratio = on
  match:title = ^(Picture-in-Picture)$
}

#windowrulev2 = move 72% 7%,title:^(Firefox)$ 

# windowrulev2 to avoid idle for fullscreen apps
#windowrulev2 = idleinhibit fullscreen, class:^(*)$
#windowrulev2 = idleinhibit fullscreen, title:^(*)$
windowrulev2 {
  name = windowrulev2-60
  idle_inhibit = fullscreen
  match:fullscreen = 1
}


# windowrulev2 move to workspace
windowrulev2 {
  name = windowrulev2-61
  workspace = 1
  match:tag = projects*
}

windowrulev2 {
  name = windowrulev2-62
  workspace = 1
  match:tag = email*
}

windowrulev2 {
  name = windowrulev2-63
  workspace = 2
  match:tag = browser*
}

windowrulev2 {
  name = windowrulev2-64
  workspace = 3
  match:class = ^([Tt]hunar)$
}

windowrulev2 {
  name = windowrulev2-65
  workspace = 4
  match:tag = im*
}

windowrulev2 {
  name = windowrulev2-66
  workspace = 5
  match:tag = gamestore*
}

windowrulev2 {
  name = windowrulev2-67
  workspace = 8
  no_blur = on
  fullscreen = on
  match:tag = games*
}

windowrulev2 {
  name = windowrulev2-68
  workspace = 1
  match:class = ^(kitty)$
  match:title = ^(tmuxifier)$
}

windowrulev2 {
  name = windowrulev2-69
  workspace = 9
  match:class = ^(virt-viewer)$
}

windowrulev2 {
  name = windowrulev2-70
  workspace = 10
  match:class = ^([Oo]bsidian)$
}


# windowrulev2 move to workspace (silent)
windowrulev2 {
  name = windowrulev2-71
  workspace = 4 silent
  match:tag = screenshare*
}

windowrulev2 {
  name = windowrulev2-72
  workspace = 9 silent
  match:class = ^(virt-manager)$
}

windowrulev2 {
  name = windowrulev2-73
  workspace = 9 silent
  match:class = ^(.virt-manager-wrapped)$
}

windowrulev2 {
  name = windowrulev2-74
  workspace = 9 silent
  match:tag = multimedia*
}


# FLOAT
windowrulev2 {
  name = windowrulev2-75
  float = on
  opacity = 0.9 0.7
  size = (monitor_w*0.7) (monitor_h*0.7)
  match:tag = wallpaper*
}

windowrulev2 {
  name = windowrulev2-76
  float = on
  opacity = 0.8 0.7
  size = (monitor_w*0.7) (monitor_h*0.7)
  match:tag = settings*
}

windowrulev2 {
  name = windowrulev2-77
  float = on
  match:tag = viewer*
}

windowrulev2 {
  name = windowrulev2-78
  float = on
  match:class = ([Zz]oom|onedriver|onedriver-launcher)$
}

windowrulev2 {
  name = windowrulev2-79
  float = on
  match:class = (org.gnome.Calculator)
  match:title = (Calculator)
}

windowrulev2 {
  name = windowrulev2-80
  float = on
  match:class = ^(mpv|com.github.rafostar.Clapper)$
}

windowrulev2 {
  name = windowrulev2-81
  float = on
  match:class = ^([Qq]alculate-gtk)$
}

