# windowrulev2 - ######### float popups and dialogue #######
windowrulev2 {
  name = windowrulev2-84
  float = on
  center = on
  match:title = ^(Authentication Required)$
}

windowrulev2 {
  name = windowrulev2-85
  float = on
  match:class = (codium|codium-url-handler|VSCodium)
  match:title = negative:(.*codium.*|.*VSCodium.*)
}

windowrulev2 {
  name = windowrulev2-86
  float = on
  match:class = ^(com.heroicgameslauncher.hgl)$
  match:title = negative:(Heroic Games Launcher)
}

windowrulev2 {
  name = windowrulev2-87
  float = on
  match:class = ^([Ss]team)$
  match:title = negative:^([Ss]team)$
}


windowrulev2 {
  name = windowrulev2-88
  float = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  center = on
  match:title = ^(Add Folder to Workspace)$
}


windowrulev2 {
  name = windowrulev2-89
  float = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  center = on
  match:title = ^(Save As)$
}


windowrulev2 {
  name = windowrulev2-90
  float = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  match:initial_title = (Open Files)
}


windowrulev2 {
  name = windowrulev2-91
  float = on
  center = on
  size = (monitor_w*0.16) (monitor_h*0.12)
